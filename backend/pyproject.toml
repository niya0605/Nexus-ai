[project]
name = "nexus-ai-backend"
version = "0.1.0"
description = "Nexus AI backend — FastAPI modular monolith."
requires-python = ">=3.12"
readme = "../README.md"

# Intentionally minimal. Feature dependencies (Celery, Redis client,
# JWT/argon2 libraries, Qdrant client, etc.) are added module-by-module in
# later milestones, per the frozen Technical Design Document — not
# installed speculatively ahead of the code that needs them.
#
# pydantic-settings (M0.2B): the centralized configuration layer in
# app/config/. Pulls in pydantic itself as a transitive dependency, which
# FastAPI already depends on.
#
# sqlalchemy / alembic / asyncpg (M0.2C): the database infrastructure in
# app/db/ and alembic/ — engine, session factory, and migrations. No ORM
# helper libraries, no SQLModel, no repository framework.
#
# argon2-cffi (S1B): the only password-hashing dependency — no custom
# cryptography, per the frozen Technical Design Document.
# pydantic[email] (S1B): RFC 5322 email format validation (email-validator)
# for registration — hand-rolling that regex correctly is notoriously
# error-prone, so this uses the established library instead.
# PyJWT (S1C.1): JWT access token creation/verification — the only JWT
# library, per the Technical Design Document's Security Architecture.
# Refresh tokens are NOT JWTs (see app/core/security.py) and need no
# library beyond the stdlib `secrets`/`hashlib` modules.
# redis (S1D): the official async Redis client — server-side refresh-
# token storage/validation/rotation, per the frozen Technical Design
# Document. First milestone Redis is required; app/db/redis.py mirrors
# app/db/session.py's engine-construction pattern for it.
# minio (S2A): the official MinIO Python SDK — object storage for
# uploaded documents (app/core/storage.py). Sync-only, wrapped in
# `asyncio.to_thread` at every call site, the same pattern
# app/core/mailer.py already established for stdlib `smtplib`.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "argon2-cffi>=23.1",
    "pydantic[email]>=2.9",
    "PyJWT>=2.9",
    "redis>=5.0",
    "minio>=7.2",
    "python-multipart>=0.0.9",
    "google-generativeai>=0.8",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Mirrors the frontend scaffold's inclusion of eslint: baseline tooling,
# not a feature library.
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    # httpx (S1B): required by FastAPI's TestClient for HTTP-level
    # endpoint tests (app/api/v1/endpoints/auth.py's registration route).
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# B008: FastAPI's dependency-injection pattern (`= Depends(get_db)`) is a
# call in a default argument by design — this rule exists for a real
# footgun in general Python, but flags every route this codebase writes.
# UP046/UP047: PEP 695 generic syntax isn't used for Pydantic generic
# models (app/core/responses.py's SuccessEnvelope) — the classic
# Generic[T]/TypeVar form is what Pydantic's own docs use and is the
# better-supported pattern for now.
ignore = ["B008", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# Hand-written to match Alembic's own generated migration template
# exactly (Union[...]/typing.Sequence, not the modern `|`/collections.abc
# equivalents) — deliberate, for recognizability against any future
# autogenerated migration, not an oversight.
"alembic/versions/*.py" = ["UP007", "UP035"]

[tool.pytest.ini_options]
# Discovers both backend/tests/ (cross-cutting) and each module's own
# app/modules/<name>/tests/ (per the Technical Design Document's module
# template, Section 31) — not just the former.
testpaths = ["tests", "app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
