; Alembic configuration for Nexus AI.
;
; The database connection URL is intentionally NOT set here — it is
; built dynamically from the application's own Settings object in
; alembic/env.py, so configuration is never duplicated between this
; file and app/config/.

[alembic]
script_location = alembic
prepend_sys_path = .

; Migration filenames follow the date-based convention already frozen in
; the PostgreSQL Database Design (Section 15), e.g. 20260803_create_documents.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s
truncate_slug_length = 60
timezone = UTC

version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
